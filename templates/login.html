{% extends 'base.html' %}
{% block title %}Select Test · SAT Math Score Tool{% endblock %}
{% block content %}
  <style>
    .begin-scoring-panel {
      width: min(980px, 92vw);
      margin: clamp(110px, 13vh, 170px) auto 2rem;
      background: #fff;
      border: 1px solid #e2ddd3;
      border-radius: 1.25rem;
      box-shadow: 0 18px 45px rgba(17, 17, 17, 0.08);
      padding: clamp(1.5rem, 4vw, 2.75rem);
      margin-bottom: 2rem;
    }

    .begin-scoring-panel h2 {
      margin-top: 0;
    }

    .scoring-form-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 1rem 1.25rem;
      align-items: end;
      margin-bottom: 1.5rem;
    }

    .scoring-form-grid .field {
      margin-bottom: 1.2rem;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .scoring-form-grid .field label {
      display: block;
      font-weight: 600;
      letter-spacing: 0.05em;
      margin-bottom: 0.4rem;
      color: #151515;
    }

    .scoring-form-grid input,
    .scoring-form-grid select {
      width: 100%;
      max-width: 100%;
      display: block;
      position: static;
      padding: 0.85rem 0.95rem;
      border-radius: 0.85rem;
      border: 1px solid #e2ddd3;
      box-sizing: border-box;
      background: #fbfaf7;
      color: inherit;
      font-size: 1rem;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .scoring-form-grid input:focus,
    .scoring-form-grid select:focus {
      outline: none;
      border-color: #c6a764;
      box-shadow: 0 0 0 3px rgba(198, 167, 100, 0.25);
    }

    .scoring-form-grid .field--email {
      grid-column: 1 / 2;
    }

    .scoring-form-grid .field--password {
      grid-column: 2 / 3;
    }

    .scoring-form-grid .field-spacer {
      grid-column: 3 / 4;
    }

    .scoring-form-grid .action-field {
      grid-column: 1 / 2;
      margin-top: 0;
      padding-top: 1.95rem;
      display: flex;
      align-items: end;
      justify-content: flex-start;
    }

    .scoring-form-grid .action-field .start-answers-btn {
      min-width: 214px;
      min-height: 60px;
    }

    @media (max-width: 640px) {
      .begin-scoring-panel {
        width: 100%;
        margin-top: 110px;
      }

      .scoring-form-grid {
        grid-template-columns: 1fr;
      }

      .scoring-form-grid .field--email,
      .scoring-form-grid .field--password,
      .scoring-form-grid .field-spacer,
      .scoring-form-grid .action-field {
        grid-column: auto;
        margin-top: 0;
      }

      .scoring-form-grid .action-field .start-answers-btn {
        width: 100%;
        min-width: 0;
      }
    }
  </style>

  <section class="card begin-scoring-panel">
    <h2>Login</h2>
    {% if tests %}
      <form method="post" action="{{ url_for('login') }}" class="scoring-form-grid">
        <input type="hidden" name="test_id" value="{{ selected_test_id }}" />
        <div class="field field--email">
          <label for="email">Email</label>
          <input type="email" name="email" id="email" placeholder="e.g. jordan.lee@example.com" autocomplete="email" required />
        </div>
        <div class="field field--password">
          <label for="password">Password</label>
          <input type="password" name="password" id="password" autocomplete="current-password" required />
        </div>
        <div class="field-spacer" aria-hidden="true"></div>
        <div class="action-field">
          <div class="sqs-block" data-definition-name="website.components.button">
            <div class="sqs-block-content">
              <div class="sqs-block-button-container sqs-block-button-container--left">
                <div class="sqs-stretched">
                  <button type="submit" class="start-answers-btn btn btn--border theme-btn--primary-inverse sqs-button-element--tertiary">Log In</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </form>
    {% else %}
      <p class="empty-state">No test files were found. Add one or more CSV files to the <code>data/</code> folder to begin scoring responses.</p>
    {% endif %}
  </section>
{% endblock %}
