services:
  - type: web
    name: webapp
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DB_ENABLED
        value: "1"
      - key: DB_SSLMODE
        value: require
      - key: DATABASE_URL
        fromDatabase:
          name: WebApp
          property: connectionString

databases:
  - name: WebApp
    plan: starter
    databaseName: WebApp
    user: webapp_user
